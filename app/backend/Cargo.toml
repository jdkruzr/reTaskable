[package]
name = "retaskable-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
appload-client = { path = "../../vendor/appload-client" }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
anyhow = "1"
roxmltree = "0.20"
url = "2"
icalendar = "0.16"
